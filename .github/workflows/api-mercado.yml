# Actualiza la API de mercado de Mirage cada semana, sin depender de ningún equipo local.
# Descarga las fuentes primarias, regenera web/public/api/v1 y, si hay cambios, los sube a main;
# Vercel publica el sitio con cada push.
name: API de mercado

on:
  schedule:
    - cron: "0 11 * * 1"   # lunes 6:00 a. m. hora de Colombia
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: api-mercado
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: ml
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ml/requirements-api.txt
      - run: pip install -r requirements-api.txt
      # Historia del formato 88 de la semana anterior: así solo se piden los meses recientes
      - uses: actions/cache@v4
        with:
          path: ml/data/processed/superfinanciera_tasas_detalle.parquet
          key: f88-${{ github.run_id }}
          restore-keys: f88-
      - name: Descargar fuentes y regenerar la API
        run: python -m mirage.actualizar
      - name: Subir cambios
        working-directory: .
        run: |
          git config user.name "mirage-bot"
          git config user.email "mirage-bot@users.noreply.github.com"
          git add web/public/api/v1 ml/reports/spread_soberano_mensual.csv ml/reports/inflacion_implicita_mensual.csv ml/reports/prima_pais_mensual.csv
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git commit -m "API de mercado: corte $(date -u +%F)"
          git push
